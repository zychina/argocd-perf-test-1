apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: app1-data-pvc
  namespace: clawtest
  labels:
    app: app1
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Mi
  selector:
    matchLabels:
      alicloud-pvname: nas-test
  storageClassName: nas
  volumeMode: Filesystem
  volumeName: nas-test
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: app1-log-pvc
  namespace: clawtest
  labels:
    app: app1
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Mi
  selector:
    matchLabels:
      alicloud-pvname: nas-test
  storageClassName: nas
  volumeMode: Filesystem
  volumeName: nas-test
