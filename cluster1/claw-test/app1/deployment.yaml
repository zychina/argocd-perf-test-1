apiVersion: apps/v1
kind: Deployment
metadata:
  name: app1
  namespace: clawtest
  labels:
    app: app1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app1
  template:
    metadata:
      labels:
        app: app1
    spec:
      containers:
      - name: app1
        image: anolis-registry.cn-hongkong.cr.aliyuncs.com/openanolis/nginx:1.14.1-8.6
        ports:
        - containerPort: 80
        volumeMounts:
        - name: data-vol
          mountPath: /data
        - name: log-vol
          mountPath: /var/log/app
      volumes:
      - name: data-vol
        persistentVolumeClaim:
          claimName: app1-data-pvc
      - name: log-vol
        persistentVolumeClaim:
          claimName: app1-log-pvc
